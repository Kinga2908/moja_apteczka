{% extends 'leki/base.html' %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card border-danger">
    <div class="card-header bg-danger text-white">
        <h5 class="mb-0"><i class="fas fa-trash me-2"></i>Usuń lek</h5>
    </div>
    <div class="card-body text-center py-4">
        <i class="fas fa-pills fa-3x text-danger mb-3 d-block"></i>
        <h5>Czy na pewno chcesz usunąć lek?</h5>
        <p class="fs-5 fw-bold">{{ lek.nazwa }}</p>
        <p class="text-muted small">
            Ta operacja usunie również całą historię przyjęć tego leku
            oraz harmonogramy przypomnień. Nie można tego cofnąć.
        </p>
        <div class="d-flex gap-3 justify-content-center mt-4">
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">
                    <i class="fas fa-trash me-1"></i>Tak, usuń
                </button>
            </form>
            <a href="{% url 'lista_lekow' %}" class="btn btn-secondary px-4">
                <i class="fas fa-times me-1"></i>Anuluj
            </a>
        </div>
    </div>
</div>
</div>
</div>
{% endblock %}
